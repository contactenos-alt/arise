workflows:
  arise_system_ci:
    name: ARISE SYSTEM CI
    max_build_duration: 60
    environment:
      node: 20.11.1
      vars:
        APP_DIR: arise-system
    scripts:
      - name: Validate JavaScript modules
        script: |
          node --version
          node --check "$APP_DIR/app.js"
          node --check "$APP_DIR/modules/ui/render.js"
          node --check "$APP_DIR/modules/core/missions.js"
      - name: Validate manifest
        script: |
          jq . "$APP_DIR/manifest.json" >/dev/null
      - name: Package PWA artifact
        script: |
          rm -rf build
          mkdir -p build
          cp -R "$APP_DIR" build/arise-system
          cd build
          zip -r arise-system-pwa.zip arise-system
    artifacts:
      - build/arise-system-pwa.zip
      - arise-system/**
